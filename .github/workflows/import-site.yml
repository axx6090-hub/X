name: Import reference site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import reference repository
        run: |
          set -e
          git clone --depth 1 https://github.com/hshahahaha/ayman-ph-website.git /tmp/reference
          rsync -a --delete --exclude '.git' --exclude '.github/workflows/' /tmp/reference/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
            exit 0
          fi
          git commit -m 'Import reference website from ayman-ph-website [skip ci]'
          git push
