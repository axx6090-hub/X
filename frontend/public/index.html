        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
            (function () {
                var MIN = 10000;
                var MAX = 20000;
                var INTERVAL = 3000;

                function randomPurchases() {
                    return Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
                }

                function addOrUpdateSocialProof() {
                    var cards = document.querySelectorAll('[data-testid^="product-card-"]');
                    cards.forEach(function (card) {
                        var isFree = card.textContent && card.textContent.indexOf("مجاني") !== -1;
                        if (!isFree) return;

                        var proof = card.querySelector('[data-free-social-proof="true"]');
                        if (!proof) {
                            proof = document.createElement("div");
                            proof.setAttribute("data-free-social-proof", "true");
                            card.appendChild(proof);
                        }
                        proof.textContent = "تم شراء " + randomPurchases().toLocaleString("en-US") + " قطعة في آخر 24 ساعة";
                    });
                }

                function start() {
                    addOrUpdateSocialProof();
                    setInterval(addOrUpdateSocialProof, INTERVAL);

                    var root = document.getElementById("root");
                    if (root && window.MutationObserver) {
                        var observer = new MutationObserver(function () {
                            addOrUpdateSocialProof();
                        });
                        observer.observe(root, { childList: true, subtree: true });
                    }
                }

                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", start);
                } else {
                    start();
                }
            })();
        </script>
